<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="headband" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Headband Arch -->
  <path d="M110 230 C100 120, 300 120, 290 230" fill="none" stroke="url(#headband)" stroke-width="22" stroke-linecap="round"/>
  <path d="M125 210 C120 135, 280 135, 275 210" fill="none" stroke="#0b0f17" stroke-width="8" stroke-linecap="round"/>

  <!-- Left Fork & Pivot -->
  <rect x="94" y="215" width="20" height="40" rx="4" fill="#64748b"/>
  <!-- Right Fork & Pivot -->
  <rect x="286" y="215" width="20" height="40" rx="4" fill="#64748b"/>

  <!-- Left Ear Cup -->
  <ellipse cx="104" cy="265" rx="30" ry="50" fill="url(#cupGrad)" stroke="#64748b" stroke-width="2.5"/>
  <ellipse cx="104" cy="265" rx="22" ry="40" fill="#090d16" stroke="#a855f7" stroke-width="2" filter="url(#purpleGlow)"/>
  <circle cx="104" cy="265" r="10" fill="#1e293b" stroke="#64748b"/>

  <!-- Right Ear Cup -->
  <ellipse cx="296" cy="265" rx="30" ry="50" fill="url(#cupGrad)" stroke="#64748b" stroke-width="2.5"/>
  <ellipse cx="296" cy="265" rx="22" ry="40" fill="#090d16" stroke="#a855f7" stroke-width="2" filter="url(#purpleGlow)"/>
  <circle cx="296" cy="265" r="10" fill="#1e293b" stroke="#64748b"/>

  <!-- Ambient Audio Waveform Decor -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="165" y1="265" x2="165" y2="285"/>
    <line x1="175" y1="250" x2="175" y2="300"/>
    <line x1="185" y1="240" x2="185" y2="310"/>
    <line x1="195" y1="255" x2="195" y2="295"/>
    <line x1="205" y1="245" x2="205" y2="305"/>
    <line x1="215" y1="235" x2="215" y2="315"/>
    <line x1="225" y1="250" x2="225" y2="300"/>
    <line x1="235" y1="265" x2="235" y2="285"/>
  </g>
</svg>
