<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="dockBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Base Plate -->
  <ellipse cx="200" cy="310" rx="140" ry="40" fill="url(#dockBody)" stroke="#475569" stroke-width="2"/>
  <ellipse cx="200" cy="308" rx="136" ry="36" fill="#0b0f17"/>

  <!-- Glowing Ambient Base Ring -->
  <ellipse cx="200" cy="308" rx="128" ry="32" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#cyanGlow)"/>

  <!-- Phone Stand Arm -->
  <path d="M190 300 L190 140 L210 140 L210 300 Z" fill="#1e293b" stroke="#334155"/>

  <!-- Phone Angled MagSafe Pad -->
  <rect x="140" y="80" width="120" height="170" rx="16" fill="url(#dockBody)" stroke="#64748b" stroke-width="2.5" transform="rotate(-6 200 165)"/>
  <circle cx="195" cy="160" r="32" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#cyanGlow)" stroke-dasharray="6,4"/>
  <circle cx="195" cy="160" r="10" fill="#38bdf8"/>

  <!-- Watch Charging Arm (Right) -->
  <path d="M205 180 Q270 170 280 130" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <circle cx="280" cy="125" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="280" cy="125" r="14" fill="#0b0f17" stroke="#22c55e" stroke-width="1.5" filter="url(#cyanGlow)"/>

  <!-- Earbuds Charging Pad (Left on base) -->
  <ellipse cx="130" cy="308" rx="26" ry="16" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="130" cy="308" r="4" fill="#22c55e" filter="url(#cyanGlow)"/>
</svg>
